name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test & vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Download modules
        run: go mod download

      - name: Verify formatting
        run: |
          test -z "$(gofmt -l .)" || (echo "gofmt errors:" && gofmt -l . && exit 1)

      - name: go vet
        run: go vet ./...

      - name: Run tests
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
        env:
          CGO_ENABLED: "1"

      - name: Show coverage summary
        run: |
          go tool cover -func=coverage.out | tail -1

      - name: Upload coverage artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  build:
    name: Build (linux/amd64)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Download modules
        run: go mod download

      - name: Build binary
        run: |
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -ldflags="-s -w" -o domainsentinel .
        env:
          CGO_ENABLED: "1"

      - name: Verify binary is valid
        run: |
          file ./domainsentinel
          test -x ./domainsentinel
          echo "Binary size: $(stat -c%s ./domainsentinel) bytes"

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: domainsentinel:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (image starts, /health responds)
        run: |
          docker run --rm -d --name ds-test -e DS_PORT=3000 domainsentinel:ci
          sleep 5
          test "$(docker exec ds-test curl -sf http://localhost:3000/health)" = "OK"
          docker stop ds-test
