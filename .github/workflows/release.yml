name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Comma-separated list of target platforms'
        required: false
        default: 'linux/amd64'
        type: string

permissions:
  contents: write
  packages: write

jobs:
  docker:
    name: Build & push image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        if: startsWith(github.ref, 'refs/tags/')
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "MAJOR_MINOR=$(echo $VERSION | cut -d. -f1,2)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine target platforms
        id: platforms
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "PLATFORMS=${{ inputs.platforms }}" >> $GITHUB_OUTPUT
          else
            # Tag pushes default to amd64 only (CGO+multi-arch is slow)
            # To enable multi-arch, run this workflow manually with platforms input
            echo "PLATFORMS=linux/amd64" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        if: contains(steps.platforms.outputs.PLATFORMS, 'arm64')
        uses: docker/setup-qemu-action@v3

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ steps.platforms.outputs.PLATFORMS }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.version.outputs.VERSION != '' && format('ghcr.io/{0}/domainsentinel:{1}', github.repository, steps.version.outputs.VERSION) || '' }}
            ${{ steps.version.outputs.MAJOR_MINOR != '' && format('ghcr.io/{0}/domainsentinel:{1}', github.repository, steps.version.outputs.MAJOR_MINOR) || '' }}
            ${{ format('ghcr.io/{0}/domainsentinel:latest', github.repository) }}
          labels: |
            org.opencontainers.image.title=DomainSentinel
            org.opencontainers.image.description=Live inventory of domains, subdomains and services (Cloudflare + Traefik + Docker + HTTP/TLS)
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: GitHub Release
    needs: docker
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true

