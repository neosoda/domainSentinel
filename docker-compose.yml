# DomainSentinel — docker-compose
# Access via: domains.techsentinel.fr (Traefik + Authentik)
#
# Networks:
#   proxy      — Traefik entry, Docker socket proxy
#   internal   — (optional) internal services
#
# IMPORTANT: No port mapping. Only Traefik routes this service.

services:
  domainsentinel:
    image: domainsentinel:latest
    container_name: domainsentinel
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      # SQLite data (persistent) — writable bind mount
      - ./data:/data:rw
      # Annotations / config (writable for future use)
      - ./config:/config:rw
      # Traefik dynamic config (read-only — parse router rules from YAML)
      - /opt/traefik/dynamic:/traefik-dynamic:ro
      # Docker socket (read-only mount, non-root user with supplementary docker group)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # Cloudflare
      - CLOUDFLARE_TOKEN=${CLOUDFLARE_TOKEN}
      - CLOUDFLARE_ZONE_NAME=${CLOUDFLARE_ZONE_NAME:-techsentinel.fr}
      - CLOUDFLARE_TIMEOUT_S=${CLOUDFLARE_TIMEOUT_S:-15}
      # App
      - DS_HOST=0.0.0.0
      - DS_PORT=3000
      - DS_DATA_DIR=/data
      - DS_CONFIG_DIR=/config
      - DS_LOG_LEVEL=${DS_LOG_LEVEL:-INFO}
      # Docker (local socket for initial scan, socket-proxy for runtime)
      - DOCKER_HOST=unix:///var/run/docker.sock
      - DOCKER_TIMEOUT_S=10
      - TRAEFIK_DYNAMIC_DIR=/traefik-dynamic
      # Healthcheck settings
      - HEALTHCHECK_TIMEOUT_S=10
      - HEALTHCHECK_CONCURRENCY=10
      - HEALTHCHECK_INTERVAL_S=60
      - SCANNER_INTERVAL_S=30
      - HISTORY_RETENTION_DAYS=30
    labels:
      # ─── Coolify-style Traefik labels (cinetrack-compatible) ────────────────
      - "traefik.enable=true"
      # Middlewares
      - "traefik.http.middlewares.gzip.compress=true"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      # HTTP router (web → redirect to HTTPS)
      - "traefik.http.routers.http-0-domainsentinel.entryPoints=web"
      - "traefik.http.routers.http-0-domainsentinel.middlewares=redirect-to-https"
      - "traefik.http.routers.http-0-domainsentinel.rule=Host(`domain.techsentinel.fr`) && PathPrefix(`/`)"
      - "traefik.http.routers.http-0-domainsentinel.service=http-0-domainsentinel"
      # HTTPS router (websecure → TLS + Authentik + gzip)
      - "traefik.http.routers.https-0-domainsentinel.entryPoints=websecure"
      - "traefik.http.routers.https-0-domainsentinel.middlewares=authentik@docker,gzip"
      - "traefik.http.routers.https-0-domainsentinel.rule=Host(`domain.techsentinel.fr`) && PathPrefix(`/`)"
      - "traefik.http.routers.https-0-domainsentinel.tls=true"
      - "traefik.http.routers.https-0-domainsentinel.tls.certresolver=letsencrypt"
      - "traefik.http.routers.https-0-domainsentinel.service=https-0-domainsentinel"
      # Services
      - "traefik.http.services.http-0-domainsentinel.loadbalancer.server.port=3000"
      - "traefik.http.services.https-0-domainsentinel.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  proxy:
    external: true
